<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Phishing Detector</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
        135deg,
        #020617,
        #0f172a,
        #1e293b
    );

    overflow:hidden;
}

/* Animated background */

body::before{

    content:"";

    position:absolute;

    width:600px;
    height:600px;

    background:#2563eb;

    border-radius:50%;

    filter:blur(120px);

    opacity:0.25;

    top:-200px;
    left:-200px;

    animation:move1 8s infinite alternate;
}

body::after{

    content:"";

    position:absolute;

    width:500px;
    height:500px;

    background:#9333ea;

    border-radius:50%;

    filter:blur(120px);

    opacity:0.25;

    bottom:-200px;
    right:-200px;

    animation:move2 8s infinite alternate;
}

@keyframes move1{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(100px,100px);
    }
}

@keyframes move2{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(-100px,-100px);
    }
}

/* Card */

.container{

    width:420px;

    padding:35px;

    border-radius:25px;

    background:
    rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);

    border:
    1px solid rgba(255,255,255,0.12);

    box-shadow:
    0 0 40px rgba(0,0,0,0.5);

    text-align:center;

    color:white;

    position:relative;

    z-index:10;

    animation:float 3s ease-in-out infinite;
}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0px);
    }
}

h1{

    margin-bottom:10px;

    font-size:32px;
}

p{

    color:#cbd5e1;

    margin-bottom:25px;
}

/* Input */

input{

    width:100%;

    padding:15px;

    border:none;

    outline:none;

    border-radius:12px;

    margin-bottom:18px;

    font-size:15px;

    background:
    rgba(255,255,255,0.1);

    color:white;
}

input::placeholder{

    color:#cbd5e1;
}

/* Button */

button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:
    linear-gradient(
        90deg,
        #2563eb,
        #9333ea
    );

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;
}

button:hover{

    transform:scale(1.03);

    box-shadow:
    0 0 20px rgba(37,99,235,0.6);
}

/* Result */

.result{

    margin-top:25px;

    padding:18px;

    border-radius:15px;

    display:none;

    animation:fadeIn 0.5s ease;
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.safe{

    background:
    rgba(34,197,94,0.15);

    border:
    1px solid #22c55e;

    color:#86efac;
}

.phishing{

    background:
    rgba(239,68,68,0.15);

    border:
    1px solid #ef4444;

    color:#fca5a5;
}

.footer{

    margin-top:20px;

    font-size:12px;

    color:#94a3b8;
}

</style>

</head>

<body>

<div class="container">

    <h1>🔐 AI Phishing Detector</h1>

    <p>
        Detect fake and malicious URLs
        using Machine Learning
    </p>

    <input
        type="text"
        id="urlInput"
        placeholder="Enter URL..."
    >

    <button onclick="scanURL()">
        Scan URL
    </button>

    <div id="result" class="result"></div>

    <div class="footer">
        Powered by XGBoost + Flask
    </div>

</div>

<script>

async function scanURL(){

    const url =
    document.getElementById("urlInput").value;

    const resultBox =
    document.getElementById("result");

    if(url === ""){

        alert("Please enter URL");

        return;
    }

    resultBox.style.display = "block";

    resultBox.className = "result";

    resultBox.innerHTML =
    "⏳ Scanning URL...";

    try{

        const response = await fetch(

            "http://127.0.0.1:5000/predict",

            {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    url:url
                })
            }
        );

        const data =
        await response.json();

        if(data.result.includes("Phishing")){

            resultBox.className =
            "result phishing";

            resultBox.innerHTML =

            "⚠️ " + data.result +

            "<br><br>" +

            "Confidence: " +

            data.confidence +

            "%";
        }

        else{

            resultBox.className =
            "result safe";

            resultBox.innerHTML =

            "✅ " + data.result +

            "<br><br>" +

            "Confidence: " +

            data.confidence +

            "%";
        }

    }

    catch(error){

        resultBox.className =
        "result phishing";

        resultBox.innerHTML =
        "❌ Flask server not running";
    }
}

</script>

</body>

</html>
